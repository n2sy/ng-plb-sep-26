<input [(ngModel)]="selectedStatut" type="text" class="form-control" />
<br />
<ol class="list-group">
  @for (serv of allServers | filter: selectedStatut; track $index) {
    <li class="list-group-item" [ngClass]="affecterClasse(serv.statut)">
      {{ serv.nom | short: 10 }} | {{ serv.type | titlecase }} |
      {{ serv.date_d | date: "fullDate" | uppercase }}
      <span class="badge text-bg-secondary">{{ serv.statut }} </span>
    </li>
  }
</ol>

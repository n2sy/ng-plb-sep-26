@if (showError) {
  <div class="alert alert-danger">Login et/ou Mot de passe invalide(s)</div>
}
<form #f="ngForm" (ngSubmit)="submitHandler(f)">
  <label for="">Login</label>
  <input ngModel name="email" type="text" class="form-control" />

  <label for="">Mot de passe</label>
  <input
    #inpPwd="ngModel"
    ngModel
    name="password"
    required
    minlength="5"
    type="text"
    class="form-control"
  />

  @if (inpPwd.invalid && inpPwd.touched) {
    <div class="alert alert-danger">
      Le mot de passe doit être de 5 caractères au minimium
    </div>
  }

  @if (showLogin) {
    <button class="btn btn-primary">Se Connecter</button>
    <button (click)="toggleShowLogin()" class="btn btn-warning">
      Aller à Register
    </button>
  } @else {
    <button class="btn btn-info">S'inscrire</button>
    <button (click)="toggleShowLogin()" class="btn btn-dark">

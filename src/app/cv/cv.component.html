<div class="row">
  <div class="col-6">
    <app-liste
      (eventToCv)="recupererCandidat($event)"
      [tousCandidats]="allCandidates"
    ></app-liste>
  </div>
  <div class="col-6">
    @if (selCandidat) {
      <app-details [selectedCandidat]="selCandidat"></app-details>
    } @else {
      <p>Veuillez selectionner un candidat</p>
    }
  </div>
</div>
